  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: radial-gradient(ellipse at 50% -20%, #123a7a 0%, #061433 45%, #02060f 100%);
    color: #fff; font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 18px 60px; }

  #pre-start { text-align: center; padding-top: 6vh; }
  #pre-start img { width: min(460px, 82vw); border-radius: 12px;
    box-shadow: 0 0 0 2px rgba(255,200,60,.35), 0 30px 70px -25px #000; }
  #pre-start h1 { font-size: 1.1rem; letter-spacing: .22em; text-transform: uppercase;
    color: #ffcf5a; font-weight: 400; margin: 26px 0 4px; }
  #pre-start p { color: #9fb4d6; margin: 0 0 26px; font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: .9rem; }
  .start-controls { display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  select, button {
    font: inherit; font-size: 1rem; padding: 12px 20px; border-radius: 999px;
    border: 1px solid #2f5aa0; background: #0c1c3c; color: #dbe7ff; cursor: pointer;
  }
  select { min-width: 260px; }
  #start { background: linear-gradient(180deg, #ffd766, #f0a91c);
    color: #1a1200; border-color: #ffe8a3; font-weight: 700; letter-spacing: .05em; }
  #start:hover { filter: brightness(1.08); }
  .import-row { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ghost { background: transparent; border-color: #2f5aa0; color: #9fb4d6; font-size: .9rem; padding: 9px 16px; }
  .ghost:hover { border-color: #ffd766; color: #ffd766; }
  #import-msg { font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: .82rem; min-height: 16px; max-width: 560px; }
  #import-msg.ok { color: #63d67a; }
  #import-msg.err { color: #ff7a86; }
  body.dragging { outline: 3px dashed #ffd766; outline-offset: -12px; }

  #game { display: none; }
  .top { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 18px; }
  #logo { width: 240px; border-radius: 10px; flex: 0 0 auto; }
  #levels { list-style: none; margin: 0; padding: 0; margin-left: auto;
    text-align: right; font-size: .92rem; line-height: 1.55; color: #8fa6c9;
    font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  #levels li.active { color: #ffd766; font-weight: 700; text-shadow: 0 0 12px rgba(255,215,102,.6); }
  #levels li.won { color: #63d67a; }

  #options { display: flex; align-items: center; gap: 12px; margin: 10px 0 16px; }
  .options-button {
    width: 58px; height: 58px; border-radius: 50%; background-color: #0c1c3c;
    background-size: 34px; background-repeat: no-repeat; background-position: center;
    border: 1px solid #2f5aa0; cursor: pointer; transition: .18s;
  }
  .options-button:hover { border-color: #ffd766; box-shadow: 0 0 16px rgba(255,215,102,.35); }
  .options-button.spent { opacity: .28; filter: grayscale(1); cursor: default; pointer-events: none; }
  #money { margin-left: auto; font-size: 1.5rem; font-weight: 700; color: #63d67a; font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }

  #question-box {
    background: linear-gradient(180deg, #12224a, #0a1734);
    border: 1px solid #2f5aa0; border-radius: 14px;
    padding: 20px 22px; font-size: 1.3rem; line-height: 1.5;
    min-height: 96px; display: flex; align-items: center; gap: 14px;
    box-shadow: inset 0 0 40px rgba(20,60,140,.35);
  }
  .big-text { color: #ff9f2e; font-weight: 700; flex: 0 0 auto; }

  #answer-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  @media (max-width: 720px) { #answer-box { grid-template-columns: 1fr; } }
  .answer {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    background: linear-gradient(180deg, #0e1e42, #081228);
    border: 1px solid #2f5aa0; border-radius: 999px;
    font-size: 1.08rem; cursor: pointer; transition: .18s; min-height: 58px;
  }
  .answer:hover { border-color: #ffd766; box-shadow: 0 0 18px rgba(255,215,102,.25); }
  .answer.hidden { visibility: hidden; }
  .answer.correct { background: linear-gradient(180deg, #1f8f45, #0f5c2a); border-color: #63d67a; }
  .answer.wrong { background: linear-gradient(180deg, #b3222f, #6d1119); border-color: #ff7a86; }
  .answer.locked { pointer-events: none; }
  .pct { margin-left: auto; color: #ffd766; font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: .95rem; }

  #hint { min-height: 22px; margin-top: 14px; color: #ffcf5a; font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    font-size: .92rem; text-align: center; }

  #game-over { display: none; text-align: center; padding-top: 14vh; }
  #game-over .msg { font-size: clamp(2.2rem, 7vw, 5rem); font-weight: 700; letter-spacing: .02em; }
  #game-over .prize { color: #ffd766; margin-top: 10px; font-size: 1.4rem; font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  #game-over button { margin-top: 30px; }
</style>
</head>

const AMOUNTS = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000, 250000, 500000, 1000000];
const LETTERS = ['A', 'B', 'C', 'D'];

/* --- hiệu ứng âm thanh nhỏ bằng WebAudio (không cần tệp mp3) --- */
let actx = null;
function tone(freq, dur, type, when, gain) {
  if (!actx) return;
  const t0 = actx.currentTime + (when || 0);
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain || 0.2, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(actx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
const sfx = {
  right() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.18, 'triangle', i * 0.09, 0.18)); },
  wrong() { tone(196, 0.5, 'sawtooth', 0, 0.16); tone(146.83, 0.6, 'sawtooth', 0.08, 0.16); },
  click() { tone(440, 0.06, 'square', 0, 0.06); },
  win()   { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, 0.35, 'triangle', i * 0.12, 0.2)); }
};

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const els = {
  pre: $('#pre-start'), game: $('#game'), over: $('#game-over'),
  levels: $$('#levels li'), money: $('#money'), question: $('#question-text'),
  answers: $$('#answer-box .answer'), hint: $('#hint'),
};

let state = null;

function refreshOptions(selected) {
  const sel = $('#problem-set');
  sel.innerHTML = '';
  Object.keys(BANKS).forEach((name) => {
    BANKS[name].forEach((g, i) => {
      const o = document.createElement('option');
      o.value = name + '|' + i;
      o.textContent = name + ' - Ván ' + (i + 1);
      sel.appendChild(o);
    });
  });
  if (selected) sel.value = selected;
}

/* ---- nhập bộ đề ---- */
function msg(text, cls) {
  const el = $('#import-msg');
  el.textContent = text;
  el.className = cls || '';
}

function normalizeBank(obj) {
  let games;
  if (Array.isArray(obj)) {
    games = (obj.length && obj[0] && Array.isArray(obj[0].questions)) ? obj : [{ questions: obj }];
  } else if (obj && Array.isArray(obj.games)) {
    games = obj.games;
  } else if (obj && Array.isArray(obj.questions)) {
    games = [{ questions: obj.questions }];
  } else {
    throw new Error('không tìm thấy "games" hoặc mảng câu hỏi trong tệp.');
  }
  if (!games.length) throw new Error('bộ đề không có ván nào.');
  return games.map((g, gi) => {
    const qs = (g && g.questions) || [];
    if (!qs.length) throw new Error('ván ' + (gi + 1) + ' không có câu hỏi.');
    return { questions: qs.map((q, qi) => {
      const where = 'ván ' + (gi + 1) + ', câu ' + (qi + 1);
      if (!q || typeof q.question !== 'string') throw new Error(where + ': thiếu "question".');
      if (!Array.isArray(q.content) || q.content.length !== 4)
        throw new Error(where + ': "content" phải có đúng 4 đáp án.');
      const c = Number(q.correct);
      if (!Number.isInteger(c) || c < 0 || c > 3)
        throw new Error(where + ': "correct" phải là chỉ số từ 0 đến 3.');
      return { question: q.question, content: q.content.map(String), correct: c };
    }) };
  });
}

function importBank(text, sourceName) {
  const games = normalizeBank(JSON.parse(text));
  const base = 'Bộ nhập - ' + String(sourceName || 'tệp').replace(/\.json$/i, '');
  let name = base, n = 2;
  while (BANKS[name]) name = base + ' (' + n++ + ')';
  BANKS[name] = games;
  refreshOptions(name + '|0');
  const totalQ = games.reduce((a, g) => a + g.questions.length, 0);
  msg('Đã nhập "' + name + '": ' + games.length + ' ván, ' + totalQ + ' câu hỏi. Bấm "Bắt đầu!" để chơi.', 'ok');
}

function readBankFile(file) {
  if (!file) return;
  if (!/\.json$/i.test(file.name) && file.type !== 'application/json') {
    msg('Lỗi: hãy chọn tệp .json.', 'err');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    try { importBank(String(reader.result), file.name); }
    catch (e) { msg('Lỗi: ' + e.message, 'err'); }
  };
  reader.onerror = () => msg('Không đọc được tệp.', 'err');
  reader.readAsText(file);
}

function money(n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2 }); }

function startGame(value) {
  const [name, idx] = value.split('|');
  state = {
    questions: BANKS[name][parseInt(idx, 10)].questions,
    level: 1, money: 0, transitioning: false,
    used: { fifty: false, phone: false, audience: false },
  };
  $$('#options .options-button').forEach((b) => b.classList.remove('spent'));
  els.hint.textContent = '';
  els.pre.style.display = 'none';
  els.over.style.display = 'none';
  els.game.style.display = 'block';
  render();
}

function render() {
  const q = state.questions[state.level - 1];
  els.money.textContent = money(state.money);
  els.question.textContent = q.question;
  els.answers.forEach((el, i) => {
    el.classList.remove('correct', 'wrong', 'locked', 'hidden');
    el.querySelector('.txt').textContent = q.content[i];
    el.querySelector('.pct').textContent = '';
  });
  els.levels.forEach((li, i) => {
    li.classList.toggle('active', (15 - i) === state.level);
    li.classList.toggle('won', (15 - i) < state.level);
  });
}

function lockAnswers() { els.answers.forEach((a) => a.classList.add('locked')); }

function pick(el) {
  if (state.transitioning) return;
  const index = parseInt(el.dataset.index, 10);
  const q = state.questions[state.level - 1];
  state.transitioning = true;
  lockAnswers();
  if (index === q.correct) {
    el.classList.add('correct');
    sfx.right();
    state.money = AMOUNTS[state.level - 1];
    els.money.textContent = money(state.money);
    setTimeout(() => {
      if (state.level >= state.questions.length || state.level >= 15) return win();
      state.level += 1;
      state.transitioning = false;
      els.hint.textContent = '';
      render();
    }, 1100);
  } else {
    el.classList.add('wrong');
    sfx.wrong();
    els.answers[q.correct].classList.add('correct');
    setTimeout(() => lose(), 1400);
  }
}

function win() {
  sfx.win();
  els.game.style.display = 'none';
  els.over.style.display = 'block';
  els.over.querySelector('.msg').textContent = 'Bạn đã thắng!';
  els.over.querySelector('.prize').textContent = 'Giải thưởng: $' + state.money.toLocaleString('en-US');
}

function lose() {
  els.game.style.display = 'none';
  els.over.style.display = 'block';
  els.over.querySelector('.msg').textContent = 'Trò chơi kết thúc!';
  els.over.querySelector('.prize').textContent = state.money
    ? 'Bạn ra về với $' + state.money.toLocaleString('en-US')
    : 'Bạn ra về tay trắng.';
}

/* ---- quyền trợ giúp ---- */
function fifty() {
  if (state.transitioning || state.used.fifty) return;
  state.used.fifty = true; sfx.click(); $('#fifty').classList.add('spent');
  const correct = state.questions[state.level - 1].correct;
  [0, 1, 2, 3].filter((i) => i !== correct).sort(() => Math.random() - 0.5).slice(0, 2)
    .forEach((i) => els.answers[i].classList.add('hidden'));
}

function audience() {
  if (state.transitioning || state.used.audience) return;
  state.used.audience = true; sfx.click(); $('#audience').classList.add('spent');
  const correct = state.questions[state.level - 1].correct;
  let remaining = 100; const pcts = [0, 0, 0, 0];
  const correctPct = 45 + Math.floor(Math.random() * 40);
  pcts[correct] = correctPct; remaining -= correctPct;
  const others = [0, 1, 2, 3].filter((i) => i !== correct);
  others.forEach((i, k) => {
    const val = k === others.length - 1 ? remaining : Math.floor(Math.random() * (remaining + 1));
    pcts[i] = val; remaining -= val;
  });
  els.answers.forEach((el, i) => { el.querySelector('.pct').textContent = pcts[i] + '%'; });
  els.hint.textContent = 'Khán giả đã bình chọn...';
}

function phone() {
  if (state.transitioning || state.used.phone) return;
  state.used.phone = true; sfx.click(); $('#phone-friend').classList.add('spent');
  const q = state.questions[state.level - 1];
  const sure = Math.random() < 0.75;
  const choice = sure ? q.correct : [0, 1, 2, 3].filter((i) => i !== q.correct)[Math.floor(Math.random() * 3)];
  els.hint.textContent = 'Người thân của bạn ' + (sure ? 'chắc chắn' : 'không chắc chắn') +
    ': "Tôi nghĩ là ' + LETTERS[choice] + ' - ' + q.content[choice] + '."';
}

/* ---- gắn sự kiện ---- */
refreshOptions();
els.answers.forEach((el) => el.addEventListener('click', () => pick(el)));
$('#fifty').addEventListener('click', fifty);
$('#audience').addEventListener('click', audience);
$('#phone-friend').addEventListener('click', phone);
$('#start').addEventListener('click', () => { ensureAudio(); startGame($('#problem-set').value); });
$('#again').addEventListener('click', () => {
  els.over.style.display = 'none';
  els.pre.style.display = 'block';
  els.game.style.display = 'none';
});
$('#import-btn').addEventListener('click', () => $('#import-file').click());
$('#import-file').addEventListener('change', (e) => { readBankFile(e.target.files[0]); e.target.value = ''; });
window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
window.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
window.addEventListener('drop', (e) => {
  e.preventDefault(); document.body.classList.remove('dragging');
  readBankFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
});
</script>
</body>
</html>
